<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: linear-gradient(135deg, #0f1221 0%, #1a1d3a 50%, #242850 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #fff; overflow: hidden;
  }
  .icon { font-size: 64px; margin-bottom: 16px; }
  .title { font-size: 72px; font-weight: 800; letter-spacing: -2px; }
  .tagline { font-size: 28px; color: #9fa4c4; margin-top: 12px; }
  .formats { display: flex; gap: 16px; margin-top: 32px; }
  .format { background: rgba(74,144,217,0.15); color: #4a90d9; padding: 10px 24px; border-radius: 20px; font-size: 18px; font-weight: 600; }
  .badge { background: rgba(46,204,113,0.15); color: #2ecc71; padding: 8px 20px; border-radius: 20px; font-size: 18px; margin-top: 24px; }
</style>
</head>
<body>
  <div class="icon">📄</div>
  <div class="title">CV Builder</div>
  <div class="tagline">Professional CVs in minutes. Free forever.</div>
  <div class="formats">
    <div class="format">Europass</div>
    <div class="format">LaTeX</div>
    <div class="format">Typst</div>
    <div class="format">PDF</div>
  </div>
  <div class="badge">100% Free — No Ads — Privacy First</div>
</body>
</html>
