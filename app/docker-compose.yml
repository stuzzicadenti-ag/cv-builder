services:
  app:
    container_name: stz-cvbuilder-app
    build: .
    image: stz-cvbuilder:latest
    ports:
      - "0.0.0.0:4001:4001"
    environment:
      NODE_ENV: production
      PORT: 4001
      DATABASE_URL: postgresql://cvbuilder_app:${CVBUILDER_DB_PASSWORD}@stz-shared-db:5432/stz_cvbuilder
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      PDF_DIR: /app/data/pdfs
    volumes:
      - stz-cvbuilder-pdfs:/app/data/pdfs
    networks:
      - stz-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4001/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      stz.project: "stuzzicadenti-ag"
      stz.service: "cvbuilder"

volumes:
  stz-cvbuilder-pdfs:
    name: stz-cvbuilder-pdfs

networks:
  stz-net:
    external: true
